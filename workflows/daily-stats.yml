name: Daily Stats Update

on:
  schedule:
    - cron: '30 23 * * *'   # ۳:۰۰ بامداد تهران (UTC)
  workflow_dispatch:         # امکان اجرای دستی از GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # برای ۵۰۰ ترک کافی است

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # اگر کلید دیگری داری اینجا اضافه کن
        run: python app.py update_views